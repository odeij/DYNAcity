<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__DYNACITY_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
<style>
:root {
  --font: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --sky-top: #9fbbd3;
  --sky-mid: #c7d8e5;
  --sky-horizon: #e6eef3;
  --ink: #f7fbff;
  --ink-2: rgba(234, 245, 255, 0.82);
  --ink-3: rgba(219, 236, 250, 0.64);
  --accent: #8dd0ff;
  --accent-strong: #53b8fb;
  --rim: rgba(226, 243, 255, 0.4);
  --line: rgba(230, 244, 255, 0.2);
  --glass: linear-gradient(145deg, rgba(127, 157, 182, 0.5) 0%, rgba(65, 98, 128, 0.62) 38%, rgba(34, 62, 83, 0.76) 100%);
  --glass-solid: linear-gradient(145deg, rgba(92, 124, 150, 0.9), rgba(34, 62, 83, 0.94));
  --glass-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), inset 0 0 0 1px rgba(224, 241, 255, 0.09), 0 14px 42px rgba(13, 38, 61, 0.19), 0 3px 10px rgba(10, 31, 49, 0.1);
  --control: rgba(29, 58, 82, 0.24);
  --control-hover: rgba(228, 244, 255, 0.16);
  --tab-on-bg: #fbfdff;
  --tab-on-ink: #1d2b44;
  --ok: #78ef8f;
  --warn: #ffd58b;
  --bad: #ff8a92;
  --edge: clamp(10px, 1.2vw, 16px);
  --r-sm: 10px;
  --r-md: 15px;
  --r-lg: 22px;
  --blur: blur(24px) saturate(145%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #16212c;
    --sky-mid: #22313f;
    --sky-horizon: #2f4152;
  }
}
:root[data-theme="dark"] {
  --sky-top: #16212c;
  --sky-mid: #22313f;
  --sky-horizon: #2f4152;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font: 13px/1.4 var(--font);
  letter-spacing: -0.012em;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-horizon) 62%, var(--sky-horizon) 100%);
  -webkit-font-smoothing: antialiased;
}
#scene { position: absolute; inset: 0; z-index: 0; will-change: transform; }
/* screen-wide disaster light: a lightning or blast flash, and heat's warm cast */
.flash, .heat { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; }
.flash { background: #f4f8ff; }
.heat { background: radial-gradient(ellipse at 50% 30%, rgba(255, 196, 120, 0.55), rgba(255, 128, 48, 0.4) 55%, rgba(170, 64, 24, 0.5)); mix-blend-mode: multiply; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid #d8f0ff; outline-offset: 2px; }
.glass {
  background: var(--glass);
  border: 1px solid var(--rim);
  border-radius: var(--r-lg);
  box-shadow: var(--glass-shadow);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
}
.chrome { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.chrome > * { pointer-events: auto; }

/* brand */
.brand { position: absolute; top: var(--edge); left: var(--edge); display: flex; align-items: center; gap: 10px; min-height: 38px; text-shadow: 0 1px 10px rgba(20, 50, 80, 0.55), 0 0 2px rgba(20, 50, 80, 0.35); pointer-events: none; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand .word { font-size: 21px; font-weight: 600; letter-spacing: -0.5px; }
.brand .div { width: 1px; height: 20px; background: #f6fcff66; }
.brand .city { font-size: 13px; font-weight: 500; color: #f4f9fd; }

/* lens tabs */
.tabs { position: absolute; top: var(--edge); left: 50%; transform: translateX(-50%); display: flex; gap: 2px; height: 38px; padding: 3px; border: 1px solid #e5f5ff55; border-radius: 20px; background: linear-gradient(120deg, #508cc566, #2d67a255); box-shadow: inset 0 1px 0 #ffffff14; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.tab { border: 0; border-radius: 16px; padding: 4px 14px; background: transparent; color: #f5faff; font-size: 12px; white-space: nowrap; }
.tab:hover { background: var(--control-hover); }
.tab[aria-selected="true"] { background: var(--tab-on-bg); color: var(--tab-on-ink); font-weight: 600; box-shadow: 0 0 0 1px #dff0ff55; }
.tab[hidden] { display: none; }

/* status pill */
.status { position: absolute; top: var(--edge); right: var(--edge); display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 8px 12px; border: 1px solid #e8f6ff29; border-radius: 13px; background: #40699270; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font-size: 12px; white-space: nowrap; }
.status .sep { width: 1px; height: 14px; background: #f6fcff44; }
.status b { font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(255, 255, 255, 0.14); }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.badge.assumed i { background: var(--warn); }

/* left column: tool rail + disaster tray */
.leftcol { position: absolute; top: calc(var(--edge) + 54px); left: var(--edge); bottom: 190px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; pointer-events: none; }
.leftcol > * { pointer-events: auto; }
.rail { display: grid; gap: 2px; width: 48px; padding: 4px; border-radius: var(--r-md); flex: none; }
.rail button { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 11px; background: transparent; color: #f2f9ff; }
.rail button:hover { background: var(--control-hover); }
.rail button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.9); color: var(--tab-on-ink); }
.rail svg { width: 19px; height: 19px; }
.rail button[hidden] { display: none; }

/* disaster tray: drag a tile onto the city */
.tray { width: 196px; min-height: 0; padding: 12px 10px 10px; border-radius: var(--r-md); overflow: auto; scrollbar-width: thin; }
.tray[hidden] { display: none; }
.tray h2 { margin: 0 4px; font-size: 13px; font-weight: 600; }
.tray .sub { margin: 1px 4px 10px; color: var(--ink-3); font-size: 11.5px; }
.sev { margin: 0 4px 10px; font-size: 11.5px; color: var(--ink-2); }
.sev .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.sev b { color: var(--ink); font-weight: 600; }
.sev input { width: 100%; margin: 0; accent-color: #eaf5ff; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tile { display: grid; justify-items: center; align-content: center; gap: 4px; height: 58px; padding: 6px 2px; border: 1px solid transparent; border-radius: 12px; background: rgba(255, 255, 255, 0.07); color: #f2f9ff; font-size: 10.5px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.tile:hover { background: var(--control-hover); border-color: var(--line); }
.tile:active { cursor: grabbing; }
.tile svg { width: 22px; height: 22px; pointer-events: none; }
.tile span { pointer-events: none; white-space: nowrap; }
.tile:disabled { opacity: 0.45; cursor: not-allowed; }
.ghost { position: fixed; z-index: 40; width: 60px; height: 62px; pointer-events: none; transform: translate(-50%, -60%) scale(1.12) rotate(-4deg); background: var(--glass-solid); box-shadow: var(--glass-shadow), 0 18px 40px rgba(10, 31, 49, 0.35); transition: opacity 0.12s; }
.ghost.off { opacity: 0.5; }
.draw { position: absolute; inset: 0; z-index: 5; cursor: crosshair; touch-action: none; }
.draw[hidden] { display: none; }
.hz { width: 14px; height: 14px; flex: none; }
.ghost[hidden] { display: none; }

/* right column */
.side { position: absolute; top: calc(var(--edge) + 54px); right: var(--edge); bottom: 190px; width: min(320px, calc(100vw - 2 * var(--edge))); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.side > .panel { pointer-events: auto; }
.panel { padding: 14px 16px; max-height: 100%; overflow: auto; scrollbar-width: thin; }
.panel[hidden] { display: none; }
.panel h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
.panel .sub { color: var(--ink-3); font-size: 11.5px; margin-bottom: 10px; }
.panel .close { float: right; border: 0; background: transparent; color: var(--ink-2); width: 24px; height: 24px; border-radius: 8px; margin: -4px -6px 0 0; }
.panel .close:hover { background: var(--control-hover); }
.legend-row { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 9px; padding: 4px 0; font-size: 12px; }
.legend-row .sw { width: 12px; height: 12px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35); }
.legend-row .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.legend-row.muted { opacity: 0.55; }
.ramp { height: 10px; border-radius: 999px; margin: 6px 0 4px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3); }
.ramp-labels { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.note { margin-top: 10px; color: var(--ink-3); font-size: 11.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; margin: 8px 0 10px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pbar { display: grid; grid-template-columns: 12px 1fr 44px; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
.pbar .sw { width: 10px; height: 10px; border-radius: 3px; }
.pbar .track { position: relative; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.pbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: #eaf5ff; }
.pbar .ghost { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #ffd58b; border-radius: 1px; }
.pbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.pbar .lbl { grid-column: 2 / 4; color: var(--ink-2); font-size: 11.5px; margin-bottom: -3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(255, 255, 255, 0.14); margin: 2px 4px 2px 0; }
.chip.hard { background: rgba(255, 115, 125, 0.28); }
.chip.soft { background: rgba(255, 213, 139, 0.22); }
.chip.ok { background: rgba(120, 239, 143, 0.22); }
.issue { font-size: 12px; color: var(--ink-2); margin: 6px 0; padding-left: 10px; border-left: 2px solid rgba(255, 255, 255, 0.25); }
.issue.hard { border-color: var(--bad); }
.issue.soft { border-color: var(--warn); }
.issue code { font: 600 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
.lever { padding: 9px 10px; margin: 8px 0; border-radius: var(--r-sm); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); font-size: 12px; }
.lever:hover { background: rgba(255, 255, 255, 0.14); }
.lever .t { font-weight: 600; margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.lever .m { color: var(--ink-3); font-size: 11.5px; overflow-wrap: anywhere; }
.warn-list { margin: 8px 0 0; padding-left: 16px; color: var(--ink-2); font-size: 11.5px; }
.answer-text { margin: 8px 0; font-size: 13px; line-height: 1.45; }
.lever[data-obj], .lever[data-sector] { cursor: pointer; }

/* bottom: prompt + dock */
.bottom { position: absolute; left: 50%; bottom: var(--edge); transform: translateX(-50%); width: min(1000px, calc(100vw - 2 * var(--edge))); display: grid; gap: 10px; }
.prompt { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 6px 0 16px; border-radius: 16px; }
.prompt svg { width: 18px; height: 18px; flex: none; color: #e9f6ff; }
.prompt input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; font-size: 14px; }
.prompt input::placeholder { color: rgba(230, 242, 252, 0.72); }
.prompt input:disabled { cursor: not-allowed; }
.prompt .go { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.22); color: #fff; }
.prompt .go:hover:not(:disabled) { background: rgba(255, 255, 255, 0.34); }
.prompt .go:disabled { opacity: 0.45; cursor: not-allowed; }
.prompt .seg { background: rgba(255, 255, 255, 0.12); }
.prompt .seg button { padding: 4px 10px; }
.prompt .seg[hidden] { display: none; }
.prompt .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { justify-self: start; font-size: 12px; color: var(--ink); padding: 5px 12px; border-radius: 999px; background: rgba(34, 62, 83, 0.72); border: 1px solid var(--rim); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
.progress:empty { display: none; }
.dock { display: flex; align-items: stretch; gap: 12px; padding: 10px 14px; border-radius: 18px; overflow-x: auto; scrollbar-width: none; }
.seg { display: flex; align-self: center; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); flex: none; }
.seg button { border: 0; border-radius: 999px; padding: 5px 11px; background: transparent; font-size: 12px; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--tab-on-ink); font-weight: 600; }
.kpi { flex: 1 0 92px; min-width: 92px; padding-left: 10px; border-left: 2px solid var(--kpi-rule, rgba(255, 255, 255, 0.35)); }
.kpi .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .v small { font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.kpi .l { font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
.kpi .r { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dock .more { flex: none; align-self: center; border: 1px solid var(--line); background: var(--control); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
.dock .more:hover { background: var(--control-hover); }
.dock .empty { align-self: center; color: var(--ink-2); font-size: 12px; }
table.kpis { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.kpis th { text-align: right; font-weight: 500; color: var(--ink-3); padding: 4px 0 6px 10px; }
table.kpis th:first-child, table.kpis td:first-child { text-align: left; padding-left: 0; }
table.kpis td { text-align: right; padding: 5px 0 5px 10px; border-top: 1px solid var(--line); }
.attrib { margin-top: -4px; font-size: 10px; color: rgba(30, 50, 70, 0.72); text-align: center; pointer-events: none; }
:root[data-theme="dark"] .attrib { color: rgba(220, 235, 248, 0.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .attrib { color: rgba(220, 235, 248, 0.6); } }
:root[data-satellite] .attrib { color: rgba(240, 247, 252, 0.85); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }

/* hover card */
.tip { position: absolute; z-index: 30; pointer-events: none; min-width: 200px; max-width: 260px; padding: 10px 12px; border-radius: 14px; background: var(--glass-solid); border: 1px solid var(--rim); box-shadow: var(--glass-shadow); font-size: 12px; }
.tip[hidden] { display: none; }
.tip .h { font-weight: 600; margin-bottom: 2px; overflow-wrap: anywhere; }
.tip .s { color: var(--ink-3); margin-bottom: 6px; }
.empty-state { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #1e3346; }
.empty-state[hidden] { display: none; }

@media (max-width: 760px) {
  .brand .city, .brand .div, .status .opt { display: none; }
  .status { padding: 6px 8px; min-height: 34px; }
  .tabs { top: calc(var(--edge) + 46px); max-width: calc(100vw - 2 * var(--edge)); overflow-x: auto; scrollbar-width: none; }
  .tab { padding: 4px 10px; }
  .leftcol { top: calc(var(--edge) + 96px); }
  .side { top: calc(var(--edge) + 96px); left: calc(var(--edge) + 58px); right: var(--edge); width: auto; bottom: 200px; }
}
@media (prefers-reduced-motion: reduce) { .prompt .spin { animation-duration: 2s; } .ghost { transform: translate(-50%, -60%); } }
</style>
</head>
<body>
<div id="scene" aria-label="3D view of Beirut buildings"></div>
<div class="heat" id="heat" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="empty-state" id="empty" hidden>
  <div><h1 style="font-size:18px;margin:0 0 6px">No data embedded</h1><p style="margin:0">Generate this page with <code>dynacity export-viewer</code>.</p></div>
</div>

<div class="draw" id="draw" hidden aria-label="Drag to steer the disaster"></div>

<div class="chrome">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5s1.3-6.8 3.9-9.5z"/></svg>
    <span class="word">DynaCITY</span><span class="div"></span><span class="city">Beirut</span>
  </div>

  <div class="tabs" role="tablist" aria-label="Map lens">
    <button class="tab" role="tab" data-lens="observed" aria-selected="true">Observed</button>
    <button class="tab" role="tab" data-lens="forecast" aria-selected="false">Forecast +2y</button>
    <button class="tab" role="tab" data-lens="change" aria-selected="false">Change risk</button>
    <button class="tab" role="tab" data-lens="delta" aria-selected="false" hidden>Δ vs baseline</button>
  </div>

  <div class="status" id="status"></div>

  <div class="leftcol">
  <nav class="rail glass" aria-label="View tools">
    <button id="t-reset" title="Reset view" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button id="t-2d" title="Top-down view" aria-label="Top-down view" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
    <button id="t-sat" title="Satellite view" aria-label="Satellite view" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9" r="1.5"/></svg></button>
    <button id="t-legend" title="Legend" aria-label="Legend" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <button id="t-kpis" title="All KPIs table" aria-label="All KPIs table" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button id="t-info" title="About this forecast" aria-label="About this forecast" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
    <button id="t-fx" title="Disasters" aria-label="Disasters" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5h18M5 9h13M8 13h9M10 17h5M11 21h2"/></svg></button>
  </nav>
  <section class="tray glass" id="tray" aria-label="Disasters" hidden>
    <h2>Disasters</h2>
    <div class="sub">Drag one onto the city</div>
    <div class="sev"><div class="row"><label for="sev">Severity</label><b id="sev-label">Moderate</b></div>
      <input id="sev" type="range" min="0" max="3" step="1" value="1" aria-valuetext="Moderate"></div>
    <div class="sev"><div class="row"><label for="reach">Flood reach</label><b id="reach-label">600 m</b></div>
      <input id="reach" type="range" min="200" max="2000" step="100" value="600" aria-valuetext="600 m"></div>
    <div class="tiles" id="tiles"></div>
  </section>
  </div>

  <aside class="side" aria-live="polite">
    <section class="panel glass" id="p-answer" hidden></section>
    <section class="panel glass" id="p-scenario" hidden></section>
    <section class="panel glass" id="p-inspect" hidden></section>
    <section class="panel glass" id="p-kpis" hidden></section>
    <section class="panel glass" id="p-info" hidden></section>
    <section class="panel glass" id="p-legend"></section>
  </aside>

  <div class="bottom">

    <div><span class="chip ${accepted ? 'ok' : 'hard'}">${accepted ? 'Validated' : 'Not runnable'}</span>
      <span class="chip">${c.attempts.length} attempt${c.attempts.length > 1 ? 's' : ''}</span>
      ${accepted ? `<span class="chip">${c.scenario.horizon_years}-year horizon</span>` : ''}</div>
    ${levers.map((l, i) => `<div class="lever" data-lever="${i}"><div class="t"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${STATES[l.target_state].color}"></span>${esc(l.intervention_id)}</div>
      <div class="m">→ ${esc(stateLabel(l.target_state))} · Δ log-odds ${l.log_odds_delta > 0 ? '+' : ''}${l.log_odds_delta} · step ${l.active_step} · ${l.object_ids.length.toLocaleString()} buildings</div>
      <div class="m">Source: ${esc(l.effect_source)} · confidence ${esc(l.confidence_grade)}</div></div>`).join('')}
    ${hazardCards(s)}
    ${allIssues.map((x) => `<div class="issue ${x.severity}"><code>${esc(x.code)}</code> ${esc(x.message)}${c.attempts.length > 1 ? ` <span style="color:var(--ink-3)">(attempt ${x.attempt})</span>` : ''}</div>`).join('')}
    ${accepted ? '<div class="note">Hover a lever to highlight the buildings it acts on.</div>' : ''}`;
}

const METRIC_UNIT = { change_probability: 'p', target_probability: 'p', height_m: 'm', floors: 'n', footprint_area_m2: 'm2' };
function fmtMetric(metric, v) {
  if (v === null || v === undefined) return 'n/a';
  const u = METRIC_UNIT[metric];
  return u === 'p' ? pct(v) : u === 'm' ? `${v.toFixed(1)} m` : u === 'm2' ? `${Math.round(v).toLocaleString()} m²` : Math.round(v).toLocaleString();
}
function renderAnswer() {
  const el = $('p-answer');
  const r = ui.answer;
  if (!r) { el.hidden = true; return; }
  el.hidden = false;
  const a = r.answer;
  const allIssues = r.attempts.flatMap((t, i) => t.report.issues.map((x) => ({ ...x, attempt: i + 1 })));
  const rows = !a ? '' : a.kind === 'by_sector'
    ? a.sectors.map((g) => `<div class="lever" data-sector="${esc(g.sector)}"><div class="t">${esc(g.sector)}</div>
        <div class="m">${g.buildings.toLocaleString()} building${g.buildings === 1 ? '' : 's'} · average ${fmtMetric(a.metric, g.mean_value)}</div></div>`).join('')
    : a.rows.map((x) => `<div class="lever" data-obj="${esc(x.object_id)}"><div class="t"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${STATES[x.state].color}"></span>${esc(x.sector || 'no sector')} · ${esc(x.building_use || 'use n/a')}</div>
        <div class="m">${esc(stateLabel(x.state))} · ${fmtMetric(a.metric, x.value)}</div></div>`).join('');
  el.innerHTML = `<button class="close" aria-label="Clear answer" data-close="answer">✕</button>
    <h2>${a ? 'Answer' : 'Question not answerable'}</h2><div class="sub">${esc(r.question)}</div>
    ${a ? `<p class="answer-text">${esc(a.text)}</p>` : ''}
    <div><span class="chip ${a ? 'ok' : 'hard'}">${a ? 'Computed from the data' : 'Rejected'}</span>
      ${a ? `<span class="chip">${a.matched.toLocaleString()} match${a.matched === 1 ? '' : 'es'}</span>` : ''}
      <span class="chip">${r.attempts.length} attempt${r.attempts.length > 1 ? 's' : ''}</span></div>
    ${rows}
    ${allIssues.map((x) => `<div class="issue ${x.severity}"><code>${esc(x.code)}</code> ${esc(x.message)}${r.attempts.length > 1 ? ` <span style="color:var(--ink-3)">(attempt ${x.attempt})</span>` : ''}</div>`).join('')}
    ${a ? `<div class="note">${esc(a.basis)}. The model only chose the query; every number above is computed by code.${a.rows.length || a.sectors.length ? ' Hover a row to find it; click to inspect.' : ''}</div>` : ''}`;
}

function setLens(lens) {
  ui.lens = lens;
  history.replaceState(null, '', `#lens=${lens}`);
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.lens === lens)));
  renderLegend(); render();
}
function togglePanel(id, button, force) {
  const el = $(id);
  el.hidden = force === undefined ? !el.hidden : !force;
  if (button) button.setAttribute('aria-pressed', String(!el.hidden));
  if (id === 'p-legend') renderLegend();
  if (id === 'p-kpis') renderKpiTable();
  if (id === 'p-info') renderInfo();
}

async function runScenario(text) {
  ui.busy = true; syncPrompt();
  $('progress').textContent = 'The model drafts the scenario · the validator checks it · the engine forecasts…';
  try {
    const res = await fetch('/v1/viewer/scenario', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    ui.scenario = { compilation: body.compilation, forecast: body.forecast, hazards: body.hazards ?? [] };
    ui.drops = [];
    updateDeltaScale();
    ui.highlight = null;
    // A disaster is the headline, so the camera flies to where it hits (the
    // way God's Plan cuts to the strike); otherwise to the lever buildings.
    const struck = (body.hazards ?? []).filter((h) => h.ids.length);
    const kinds = [...new Set(struck.map((h) => h.kind.replace(/_/g, ' ')))].join(', ');
    $('progress').textContent = !body.forecast ? 'The validator rejected the scenario — see why on the right.'
      : struck.length ? `${kinds[0].toUpperCase()}${kinds.slice(1)} — flying to the hardest-hit buildings.` : 'Scenario forecast ready.';
    document.querySelector('[data-lens="delta"]').hidden = !body.forecast;
    if (body.forecast) {
      setLens('delta');
      playFx(ui.scenario.hazards, ui.scenario.hazards.map((_, i) => i));
      if (struck.length === 1) focusStrike(struck[0]);
      else focusOn(struck.length ? struck.flatMap((h) => h.ids) : body.compilation.scenario.interventions.flatMap((l) => l.object_ids));
    }
  } catch (err) {
    $('progress').textContent = `Could not run scenario: ${err.message}`;
  } finally {
    ui.busy = false; syncPrompt(); renderAll();
  }
}
async function runAsk(question) {
  ui.busy = true; syncPrompt();
  $('progress').textContent = 'The model reads the question · the checker verifies the query · the answer is computed from the forecast…';
  try {
    const res = await fetch('/v1/viewer/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    ui.answer = body;
    const ids = body.answer?.highlight_ids ?? [];
    ui.answerIds = ids.length ? new Set(ids) : null;
    ui.highlight = null;
    $('progress').textContent = body.answer ? '' : 'The checker rejected the question — see why on the right.';
    if (body.answer && ids.length) {
      if (body.answer.metric === 'change_probability' && DATA.forecast && !ui.scenario) setLens('change');
      focusOn(ids);
    }
  } catch (err) {
    $('progress').textContent = `Could not answer: ${err.message}`;
  } finally {
    ui.busy = false; syncPrompt(); renderAll();
  }
}
// Screen pixel → [longitude, latitude] on the ground.
function toLngLat(x, y) {
  if (map) { const p = map.unproject([x, y]); return [p.lng, p.lat]; }
  const vp = deckgl?.getViewports()[0];
  return vp ? vp.unproject([x, y]).slice(0, 2) : null;
}
const overMap = (x, y) => { const el = document.elementFromPoint(x, y); return !!el && $('scene').contains(el); };
let drag = null, swallowClick = false;
function startDrag(e) {
  const tile = e.target.closest('.tile');
  if (!tile || tile.disabled || e.button > 0) return;
  drag = { kind: tile.dataset.kind, x0: e.clientX, y0: e.clientY, moved: false };
  tile.setPointerCapture(e.pointerId);
  const ghost = $('ghost');
  const move = (ev) => {
    if (!drag.moved && Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) < 6) return;
    if (!drag.moved) { drag.moved = true; ghost.innerHTML = tile.innerHTML; ghost.hidden = false; }
    ghost.style.left = `${ev.clientX}px`; ghost.style.top = `${ev.clientY}px`;
    ghost.classList.toggle('off', !overMap(ev.clientX, ev.clientY));
  };
  const end = (ev) => {
    tile.removeEventListener('pointermove', move); tile.removeEventListener('pointerup', end); tile.removeEventListener('pointercancel', end);
    ghost.hidden = true;
    if (drag.moved) {
      swallowClick = true;
      if (ev.type === 'pointerup' && overMap(ev.clientX, ev.clientY)) dropAt(drag.kind, ev.clientX, ev.clientY);
    }
    drag = null;
  };
  tile.addEventListener('pointermove', move); tile.addEventListener('pointerup', end); tile.addEventListener('pointercancel', end);
}
function dropAt(kind, x, y) {
  const at = toLngLat(x, y);
  if (!at || ui.busy) return;
  if (pending?.steering) cancelSteer();
  const how = HAZARDS.find((h) => h.kind === kind);
  if (how?.path || how?.aim) {
    // Touch down (or mark the impact), then the next drag steers the track
    // or swings the approach (God's Plan style).
    pending = { kind, at, path: null, aim: null, steering: true };
    $('draw').hidden = false;
    $('progress').textContent = how.path ? 'Drag to steer the tornado · or click to touch down right here · Esc cancels'
      : 'Drag out from the impact to aim where the plane comes from · or click for a pass across the view · Esc cancels';
    animate();
    return;
  }
  runDrop({ kind, points: [at], severity: SEVERITIES[$('sev').value], ...(kind === 'flood' && { radius_m: Number($('reach').value) }) });
}
function steerStart(e) {
  if (!pending?.steering) return;
  $('draw').setPointerCapture(e.pointerId);
  pending.path = [pending.at];
  pending.last = [e.clientX, e.clientY];
}
function steerMove(e) {
  if (pending?.steering && pending.kind === 'plane_crash' && pending.path) { pending.aim = toLngLat(e.clientX, e.clientY); return; }
  if (!pending?.path || !pending.steering) return;
  if (Math.hypot(e.clientX - pending.last[0], e.clientY - pending.last[1]) < 14 || pending.path.length >= 64) return;
  const p = toLngLat(e.clientX, e.clientY);
  if (p) { pending.path.push(p); pending.last = [e.clientX, e.clientY]; drawFx(); }
}
function steerEnd() {
  if (!pending?.steering || !pending.path) return;
  $('draw').hidden = true; pending.steering = false;
  if (pending.kind === 'plane_crash') {
    // Compass heading from the aim point to the impact; a short drag or a click keeps the camera's.
    const { aim, at } = pending;
    const heading = aim && metresBetween(aim, at) > 20
      ? (Math.atan2((at[0] - aim[0]) * mPerLon(at[1]), (at[1] - aim[1]) * 111320) * 180) / Math.PI : crossingHeading();
    runDrop({ kind: 'plane_crash', points: [at], severity: SEVERITIES[$('sev').value], heading });
    return;
  }
  const points = pending.path.length > 1 ? pending.path : [pending.at];
  runDrop({ kind: 'tornado', points, severity: SEVERITIES[$('sev').value] });
}
function cancelSteer() {
  $('draw').hidden = true; pending = null; $('progress').textContent = ''; drawFx();
}
async function runDrop(drop) {
  const prior = ui.scenario?.dropped ? ui.drops : [];
  // Disasters stack, God's Plan style; past eight the oldest makes way.
  ui.drops = [...prior, drop].slice(-8);
  pending = { kind: drop.kind, at: drop.points.at(-1), path: drop.points.length > 1 ? drop.points : null, steering: false,
    ...(drop.kind === 'plane_crash' && { heading: drop.heading, flyT0: performance.now() }) };
  ui.busy = true; syncPrompt(); animate();
  $('progress').textContent = `${hazardLabel(drop.kind)} strikes · the engine forecasts the damage…`;
  try {
    // The aim is the page's own: the engine only needs where the plane lands.
    const hazards = ui.drops.map(({ heading, s0, ...rest }) => rest);
    const res = await fetch('/v1/viewer/hazard', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hazards }) });
    const body = await res.json();
    if (!res.ok) throw new Error(typeof body.detail === 'string' ? body.detail : `HTTP ${res.status}`);
    ui.scenario = { compilation: null, dropped: body.scenario, forecast: body.forecast, hazards: body.hazards };
    // Hand the plane over mid-dive rather than restarting it.
    if (pending?.flyT0) drop.s0 = waitingProgress(performance.now() - pending.flyT0);
    pending = null;
    updateDeltaScale();
    ui.highlight = null;
    document.querySelector('[data-lens="delta"]').hidden = false;
    setLens('delta');
    const last = body.hazards.length - 1, hit = body.hazards[last];
    playFx(body.hazards, [last], ui.drops);
    const impact = body.forecast.hazard_impacts.find((h) => h.hazard_id === hit.hazard_id);
    if (hit.ids.length) {
      focusStrike(hit);
      $('progress').textContent = `${hazardLabel(drop.kind)}: about ${plural(Math.round(impact.destroyed.p50), 'building')} destroyed and ${Math.round(impact.damaged.p50).toLocaleString()} damaged.`;
    } else {
      $('progress').textContent = `${hazardLabel(drop.kind)} struck outside the surveyed buildings — nothing in the survey was hit.`;
    }
  } catch (err) {
    ui.drops = prior; pending = null; render();
    $('progress').textContent = `Could not run the disaster: ${err.message}`;
  } finally {
    ui.busy = false; syncPrompt(); renderAll();
  }
}
function setMode(mode) {
  ui.mode = mode;
  document.querySelectorAll('#mode [data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  syncPrompt();
}
function syncPrompt() {
  const q = $('q'), go = $('go');
  const live = !!DATA.api;
  const ask = ui.mode === 'ask';
  $('mode').hidden = !live || !DATA.forecast;
  q.disabled = !live || ui.busy;
  q.setAttribute('aria-label', ask ? 'Ask a question about the map' : 'Describe a scenario');
  go.setAttribute('aria-label', ask ? 'Ask' : 'Run scenario');
  q.placeholder = !live ? 'Run `dynacity serve --snapshot … --bbed …` to describe scenarios here'
    : ask ? 'Ask the map… e.g. “Which stalled buildings in Hamra are most likely to change?”'
    : 'Tell the city what happens… e.g. “Push stalled buildings in Mar Mikhael toward renovation”';
  go.disabled = !live || ui.busy;
  document.querySelectorAll('.tile').forEach((t) => (t.disabled = ui.busy));
  go.innerHTML = ui.busy ? '<span class="spin" aria-hidden="true"></span>' : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
}
function renderAll() { renderStatus(); renderLegend(); renderDock(); renderInspector(); renderAnswer(); renderScenario(); renderInfo(); render(); }

function wire() {
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setLens(t.dataset.lens)));
  const tabs = [...document.querySelectorAll('.tab')];
  document.querySelector('.tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const vis = tabs.filter((t) => !t.hidden), i = vis.indexOf(document.activeElement);
    const next = vis[(i + (e.key === 'ArrowRight' ? 1 : vis.length - 1)) % vis.length];
    next.focus(); setLens(next.dataset.lens);
  });
  $('t-reset').onclick = () => { ui.topDown = false; $('t-2d').setAttribute('aria-pressed', 'false'); flyTo({}); };
  $('t-2d').onclick = () => { ui.topDown = !ui.topDown; $('t-2d').setAttribute('aria-pressed', String(ui.topDown)); flyTo(ui.topDown ? { pitch: 0, bearing: 0 } : {}); };
  $('t-sat').onclick = () => setSatellite(!ui.satellite);
  $('t-legend').onclick = (e) => togglePanel('p-legend', e.currentTarget);
  $('t-kpis').onclick = (e) => togglePanel('p-kpis', e.currentTarget);
  $('t-info').onclick = (e) => togglePanel('p-info', e.currentTarget);
  $('t-fx').onclick = (e) => togglePanel('tray', e.currentTarget);
  $('tiles').innerHTML = HAZARDS.map((h) => `<button class="tile" type="button" data-kind="${h.kind}" title="${h.label}: drag onto the city (or press to drop it mid-view)">${hazardIcon(h.kind)}<span>${h.label}</span></button>`).join('');
  $('tiles').addEventListener('pointerdown', startDrag);
  $('tiles').addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (swallowClick) { swallowClick = false; return; }
    if (tile && !tile.disabled) dropAt(tile.dataset.kind, innerWidth / 2, innerHeight / 2);
  });
  $('reach').addEventListener('input', (e) => {
    const label = metres(Number(e.target.value));
    $('reach-label').textContent = label; e.target.setAttribute('aria-valuetext', label);
  });
  $('sev').addEventListener('input', (e) => {
    const label = cap(SEVERITIES[e.target.value]);
    $('sev-label').textContent = label; e.target.setAttribute('aria-valuetext', label);
  });
  $('draw').addEventListener('pointerdown', steerStart);
  $('draw').addEventListener('pointermove', steerMove);
  $('draw').addEventListener('pointerup', steerEnd);
  document.addEventListener('click', (e) => {
    const h = e.target.closest('[data-h]');
    if (h) { ui.horizon = Number(h.dataset.h); renderDock(); return; }
    if (e.target.closest('#more')) { togglePanel('p-kpis', $('t-kpis'), true); return; }
    const close = e.target.closest('[data-close]');
    if (!close) return;
    const which = close.dataset.close;
    if (which === 'inspect') { ui.selected = null; renderInspector(); render(); }
    if (which === 'kpis') togglePanel('p-kpis', $('t-kpis'), false);
    if (which === 'info') togglePanel('p-info', $('t-info'), false);
    if (which === 'answer') { ui.answer = null; ui.answerIds = null; ui.highlight = null; renderAnswer(); render(); }
    if (which === 'scenario') {
      ui.scenario = null; ui.highlight = null; ui.drops = []; clearFx();
      document.querySelector('[data-lens="delta"]').hidden = true;
      if (ui.lens === 'delta') setLens('forecast');
      $('progress').textContent = ''; renderAll();
    }
  });
  $('p-scenario').addEventListener('mouseover', (e) => {
    const card = e.target.closest('[data-lever]');
    const lever = card && ui.scenario?.compilation?.scenario?.interventions[Number(card.dataset.lever)];
    const hazard = e.target.closest('[data-hazard]');
    const hits = hazard && ui.scenario?.hazards?.find((h) => h.hazard_id === hazard.dataset.hazard)?.ids;
    const next = lever ? new Set(lever.object_ids.length ? lever.object_ids : DATA.buildings.map((b) => b.id)) : hits?.length ? new Set(hits) : null;
    if (next !== ui.highlight) { ui.highlight = next; render(); }
  });
  $('p-scenario').addEventListener('mouseleave', () => { ui.highlight = null; render(); });
  $('p-answer').addEventListener('mouseover', (e) => {
    const row = e.target.closest('[data-obj],[data-sector]');
    let next = null;
    if (row?.dataset.obj) next = new Set([row.dataset.obj]);
    else if (row?.dataset.sector) next = new Set(DATA.buildings.filter((b) => (b.sector || 'no sector') === row.dataset.sector && ui.answerIds?.has(b.id)).map((b) => b.id));
    const same = next && ui.highlight && next.size === ui.highlight.size && [...next].every((id) => ui.highlight.has(id));
    if (!same && (next || ui.highlight)) { ui.highlight = next; render(); }
  });
  $('p-answer').addEventListener('mouseleave', () => { ui.highlight = null; render(); });
  $('p-answer').addEventListener('click', (e) => {
    const row = e.target.closest('[data-obj]');
    if (!row) return;
    ui.selected = row.dataset.obj; renderInspector(); render(); focusOn([row.dataset.obj]);
  });
  document.querySelectorAll('#mode [data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('prompt').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = $('q').value.trim();
    if (!t || ui.busy) return;
    if (ui.mode === 'ask') runAsk(t); else runScenario(t);
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && pending?.steering) { cancelSteer(); return; }
    if (e.key === 'Escape' && ui.selected) { ui.selected = null; renderInspector(); render(); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
}

if (!DATA || !DATA.buildings?.length || typeof deck === 'undefined') {
  $('empty').hidden = false;
  document.querySelector('.chrome').hidden = true;
  if (DATA && typeof deck === 'undefined') $('empty').querySelector('p').textContent = 'The 3D library could not load. Check your connection and reload.';
} else {
  $('attrib').textContent = attribution();
  if (GOOGLE) document.documentElement.toggleAttribute('data-satellite', true);
  if (!DATA.forecast) document.querySelectorAll('[data-lens="forecast"],[data-lens="change"]').forEach((t) => (t.hidden = true));
  // On phones the legend starts collapsed so the city stays visible.
  if (innerWidth < 760) togglePanel('p-legend', $('t-legend'), false);
  // Dropping disasters needs the server; on phones the tray starts closed.
  $('t-fx').hidden = !DATA.api;
  if (DATA.api && innerWidth >= 760) togglePanel('tray', $('t-fx'), true);
  wire(); syncPrompt(); initScene(); renderAll();
  const hashLens = new URLSearchParams(location.hash.slice(1)).get('lens');
  const tab = hashLens && document.querySelector(`.tab[data-lens="${CSS.escape(hashLens)}"]:not([hidden])`);
  if (tab) setLens(hashLens);
}
</script>
